</style><main id="gallery"><h1>Компактные деревья навыков</h1><p>8 классов · 24 ветки · оригинальные иконки и связи Blizzless. Заголовки и очки показаны отдельным слоем.</p></main>
<script>
const classes=[{"id":"amazon","name":{"ru":"Амазонка","en":"Amazon"},"trees":[{"title":{"ru":"Дротики и копья","en":"Javelin & spear"},"svg":"amazon-javelin-spear.svg","png":"amazon-javelin-spear.png"},{"title":{"ru":"Пассивные и магические","en":"Passive & magic"},"svg":"amazon-passive-magic.svg","png":"amazon-passive-magic.png"},{"title":{"ru":"Лук и арбалет","en":"Bow & crossbow"},"svg":"amazon-bow-crossbow.svg","png":"amazon-bow-crossbow.png"}]},{"id":"sorceress","name":{"ru":"Волшебница","en":"Sorceress"},"trees":[{"title":{"ru":"Холод","en":"Cold"},"svg":"sorceress-cold.svg","png":"sorceress-cold.png"},{"title":{"ru":"Молния","en":"Lightning"},"svg":"sorceress-lightning.svg","png":"sorceress-lightning.png"},{"title":{"ru":"Огонь","en":"Fire"},"svg":"sorceress-fire.svg","png":"sorceress-fire.png"}]},{"id":"necromancer","name":{"ru":"Некромант","en":"Necromancer"},"trees":[{"title":{"ru":"Призыв","en":"Summoning"},"svg":"necromancer-summoning.svg","png":"necromancer-summoning.png"},{"title":{"ru":"Яд и кости","en":"Poison & bone"},"svg":"necromancer-poison-bone.svg","png":"necromancer-poison-bone.png"},{"title":{"ru":"Проклятия","en":"Curses"},"svg":"necromancer-curses.svg","png":"necromancer-curses.png"}]},{"id":"paladin","name":{"ru":"Паладин","en":"Paladin"},"trees":[{"title":{"ru":"Защитные ауры","en":"Defensive auras"},"svg":"paladin-defensive-auras.svg","png":"paladin-defensive-auras.png"},{"title":{"ru":"Боевые ауры","en":"Offensive auras"},"svg":"paladin-offensive-auras.svg","png":"paladin-offensive-auras.png"},{"title":{"ru":"Боевые навыки","en":"Combat skills"},"svg":"paladin-combat-skills.svg","png":"paladin-combat-skills.png"}]},{"id":"barbarian","name":{"ru":"Варвар","en":"Barbarian"},"trees":[{"title":{"ru":"Боевые кличи","en":"Warcries"},"svg":"barbarian-warcries.svg","png":"barbarian-warcries.png"},{"title":{"ru":"Мастерство боя","en":"Combat masteries"},"svg":"barbarian-combat-masteries.svg","png":"barbarian-combat-masteries.png"},{"title":{"ru":"Боевые навыки","en":"Combat skills"},"svg":"barbarian-combat-skills.svg","png":"barbarian-combat-skills.png"}]},{"id":"druid","name":{"ru":"Друид","en":"Druid"},"trees":[{"title":{"ru":"Стихии","en":"Elemental"},"svg":"druid-elemental.svg","png":"druid-elemental.png"},{"title":{"ru":"Превращения","en":"Shapeshifting"},"svg":"druid-shapeshifting.svg","png":"druid-shapeshifting.png"},{"title":{"ru":"Призыв","en":"Summoning"},"svg":"druid-summoning.svg","png":"druid-summoning.png"}]},{"id":"assassin","name":{"ru":"Ассасин","en":"Assassin"},"trees":[{"title":{"ru":"Боевые искусства","en":"Martial arts"},"svg":"assassin-martial-arts.svg","png":"assassin-martial-arts.png"},{"title":{"ru":"Теневые дисциплины","en":"Shadow disciplines"},"svg":"assassin-shadow-disciplines.svg","png":"assassin-shadow-disciplines.png"},{"title":{"ru":"Ловушки","en":"Traps"},"svg":"assassin-traps.svg","png":"assassin-traps.png"}]},{"id":"warlock","name":{"ru":"Чернокнижник","en":"Warlock"},"trees":[{"title":{"ru":"Демоны","en":"Demon"},"svg":"warlock-demon.svg","png":"warlock-demon.png"},{"title":{"ru":"Мистика","en":"Eldritch"},"svg":"warlock-eldritch.svg","png":"warlock-eldritch.png"},{"title":{"ru":"Хаос","en":"Chaos"},"svg":"warlock-chaos.svg","png":"warlock-chaos.png"}]}];
const q=new URLSearchParams(location.search), selected=q.get('class'), tree=q.get('tree'), exporting=q.has('export');
const gallery=document.getElementById('gallery');
if(exporting){document.body.className='export '+(tree!==null?'single':'preview');gallery.replaceChildren()}
for(const c of classes){if(selected&&c.id!==selected)continue;const section=document.createElement('section');section.dataset.class=c.id;section.innerHTML='<h2 class="class-title">'+c.name.ru+' · '+c.name.en+'</h2><div class="trees"></div>';const row=section.querySelector('.trees');c.trees.forEach((t,i)=>{if(tree!==null&&Number(tree)!==i)return;const panel=document.createElement('div');panel.className='tree';panel.dataset.file=t.png;panel.innerHTML='<img src="'+t.svg+'" alt="'+t.title.en+'"><div class="heading">'+t.title.en+'<small>0 Points Spent</small></div>';row.append(panel)});gallery.append(section);if(!exporting){const links=document.createElement('div');links.className='downloads';for(const t of c.trees){const a=document.createElement('a');a.href=t.svg;a.download=t.svg;a.textContent=t.title.en+' · SVG';links.append(a)}section.append(links)}}
</script></html>
